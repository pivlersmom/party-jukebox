name: Party-Jukebox
version: "0.22.2"
slug: party_jukebox
description: Jukebox, Party-Seite für Gäste und TV-Anzeige für Music Assistant
url: https://github.com/pivlersmom/party-jukebox
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
# nur lesen: dort legt ein optionales Helfer-Add-on die Klang-Analyse von Music Assistant ab (/share/ma_analyse)
map:
  - share:ro
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Webseiten (Jukebox, Party, TV) im Heimnetz
webui: "http://[HOST]:[PORT:8099]/"
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: Jukebox
options:
  ma_url: ""
  ma_token: ""
  party_name: "Party-Jukebox"
  party_player: ""
  notify_service: ""
  script_wish: ""
  script_boost: ""
  script_drink: ""
  skip_votes: true
  dmx_fixtures: []
  govee_lamps: []
  drinks:
    - "Bier|🍺|ein Bier"
    - "Weizen|🌾|ein Weizen"
    - "Radler|🍋|ein Radler"
    - "Wein|🍷|einen Wein"
    - "Sekt|🥂|einen Sekt"
    - "Cocktail|🍹|einen Cocktail"
    - "Schnaps|🥃|einen Schnaps"
    - "Cola|🥤|eine Cola"
    - "Wasser|💧|ein Wasser"
    - "Kaffee|☕|einen Kaffee"
schema:
  ma_url: str?
  ma_token: password?
  party_name: str
  party_player: str?
  notify_service: str?
  script_wish: str?
  script_boost: str?
  script_drink: str?
  skip_votes: bool
  tv_cast_entity: str?
  tv_box_entities: str?
  tv_logo_index: str?
  tv_logo_dir: str?
  app_update_repo: str?
  app_update_token: password?
  app_update_package: str?
  dmx_host: str?
  dmx_universe: int(0,32767)?
  dmx_channels: str?
  dmx_player: str?
  dmx_effect: list(beat|smooth|color)?
  dmx_delay_ms: int(-2000,5000)?
  dmx_fixtures:
    - str?
  dmx_drop_seconds: int(1,60)?
  dmx_drop_build: int(2,60)?
  dmx_drop_sensitivity: int(1,10)?
  dmx_drop_cooldown: int(5,900)?
  dmx_strobe_value: int(0,255)?
  light_switch: str?
  wled_host: str?
  wled_port: port?
  wled_player: str?
  wled_gain_db: int(-20,30)?
  wled_delay_ms: int(-2000,5000)?
  ha_lights: str?
  ha_lights_player: str?
  ha_lights_ms: int(200,5000)?
  govee_host: str?
  govee_segments: int(1,60)?
  govee_effect: list(balken|ampel|spektrum|puls|welle)?
  govee_break: list(|ampel|balken|spektrum|puls|welle)?
  govee_profile: list(auto|standard|elektro|party|pop|rock|hiphop|ruhig)?
  govee_strobe: bool?
  govee_strobe_seconds: int(1,30)?
  govee_strobe_early_ms: int(-5000,8000)?
  govee_reverse: bool?
  govee_entity: str?
  govee_lamps:
    - str?
  govee_player: str?
  govee_delay_ms: int(-2000,5000)?
  viz_probe: str?
  drinks:
    - str
