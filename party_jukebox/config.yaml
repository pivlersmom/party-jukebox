name: Party-Jukebox
version: "0.1.46"
slug: party_jukebox
description: Jukebox, Party-Seite für Gäste und TV-Anzeige für Music Assistant
url: https://github.com/pivlersmom/party-jukebox
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Webseiten (Jukebox, Party, TV) im Heimnetz
webui: "http://[HOST]:[PORT:8099]/"
panel_icon: mdi:music-circle
options:
  ma_url: ""
  ma_token: ""
  party_name: "Party-Jukebox"
  party_player: ""
  notify_service: ""
  script_wish: ""
  script_boost: ""
  script_drink: ""
  skip_votes: true
  drinks:
    - "Bier|🍺|ein Bier"
    - "Weizen|🌾|ein Weizen"
    - "Radler|🍋|ein Radler"
    - "Wein|🍷|einen Wein"
    - "Sekt|🥂|einen Sekt"
    - "Cocktail|🍹|einen Cocktail"
    - "Schnaps|🥃|einen Schnaps"
    - "Cola|🥤|eine Cola"
    - "Wasser|💧|ein Wasser"
    - "Kaffee|☕|einen Kaffee"
schema:
  ma_url: str?
  ma_token: password?
  party_name: str
  party_player: str?
  notify_service: str?
  script_wish: str?
  script_boost: str?
  script_drink: str?
  skip_votes: bool
  drinks:
    - str
