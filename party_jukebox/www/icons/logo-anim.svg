<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -118 224 244">
  <!-- Party-Jukebox-Logo (Jukebox-Bogen), animiert: Balken hüpfen, Farben wandern im Bogen -->
  <defs>
    <linearGradient id="pjar" gradientUnits="userSpaceOnUse" x1="-110" y1="0" x2="110" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff2ec8"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#00e5ff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pjbp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fd8"/><stop offset="1" stop-color="#9b4dff"/></linearGradient>
