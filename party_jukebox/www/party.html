<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Party-Jukebox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-110 -110 220 220'%3E%3Ccircle r='100' fill='none' stroke='%238b5cff' stroke-width='14'/%3E%3Cg fill='%23ff2ec8'%3E%3Crect x='-57' y='-44' width='18' height='62' rx='9'/%3E%3Crect x='-31' y='-30' width='18' height='82' rx='9'/%3E%3Crect x='-9' y='-16' width='18' height='88' rx='9'/%3E%3Crect x='13' y='-30' width='18' height='82' rx='9'/%3E%3Crect x='39' y='-44' width='18' height='62' rx='9'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#05070c; --s1:#121725; --s2:#1a2132; --s3:#232c41; --line:#2a3449;
  --tx:#eef2fa; --tx2:#9aa6bf; --tx3:#64708a;
  --pink:#ff2ec8; --violet:#8b5cff; --cyan:#00f0e0; --grad:linear-gradient(120deg,var(--pink),var(--violet) 55%,var(--cyan));
  --req:#8b5cff; --boost:#00f0e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(90vw 60vh at -10% -10%,rgba(255,46,200,.14),transparent 60%),radial-gradient(80vw 60vh at 110% 30%,rgba(139,92,255,.12),transparent 60%),radial-gradient(90vw 60vh at 40% 115%,rgba(0,240,224,.10),transparent 60%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--tx)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
header svg.lg{width:42px;height:42px;overflow:visible;flex:none}
.lg .ring{transform-origin:0 0;animation:ring 40s linear infinite}
@keyframes ring{to{transform:rotate(298deg)}}
header .t b{display:block;font-size:20px;font-weight:800;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
header .t span{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.dot{width:10px;height:10px;border-radius:50%;background:#ffb020;margin-left:auto;flex:none}
.dot.ok{background:#38e08a}

.card{background:rgba(18,23,37,.78);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;margin-bottom:14px}
.h{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.h .ic{width:16px;height:16px;color:var(--cyan)}
.h .sp{flex:1}

.now{display:flex;gap:14px;align-items:center}
.now .cv{position:relative;width:84px;height:84px;border-radius:14px;background:var(--s3) center/cover no-repeat;flex:none;overflow:hidden;display:grid;place-items:center;color:var(--tx3);cursor:pointer}
.now .cv:active{transform:scale(.96)}
.eqw{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:8px;background:linear-gradient(to top,rgba(5,7,12,.7),transparent 60%);opacity:0;transition:opacity .3s}
.playing .eqw{opacity:1}
.eqw i{width:4px;height:26px;border-radius:2px;background:var(--cyan);transform-origin:bottom;animation:eqb 1s ease-in-out infinite}
.eqw i:nth-child(2){animation-duration:.8s;animation-delay:-.3s;background:var(--violet)}
.eqw i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s;background:var(--pink)}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1.1)}}
.now .m{min-width:0;flex:1}
.now .ti{font-size:17px;font-weight:800;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now .ar{font-size:14px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:10px}
.trk{height:4px;border-radius:999px;background:var(--s3);overflow:hidden}
.fill{height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .5s linear}
.times{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--tx3);margin-top:5px;font-variant-numeric:tabular-nums}
.qbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;height:46px;border-radius:14px;background:var(--s2);border:1px solid rgba(255,255,255,.06);font-size:15px;font-weight:700}
.qbtn:active{background:var(--s3)}
.qbtn .ic{color:var(--cyan)}
.qbtn .c{color:var(--tx3);font-weight:600}
.qbtn .ar2{width:18px;height:18px;color:var(--tx3);margin-left:2px}

.quota{display:flex;gap:8px;margin-bottom:14px}
.qt{flex:1;display:flex;align-items:center;gap:10px;background:rgba(18,23,37,.78);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.qt .ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.qt.r .ib{background:var(--req)}.qt.b .ib{background:var(--boost);color:#05070c}
.qt b{font-size:17px;font-variant-numeric:tabular-nums}
.qt span{display:block;font-size:11px;color:var(--tx3);font-weight:600;white-space:nowrap}
.qt.off{display:none}

.search{position:sticky;top:0;z-index:5;padding:10px 16px;margin:0 -16px 4px;background:linear-gradient(var(--bg) 70%,transparent)}
.sbox{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:16px;height:52px;padding:0 14px}
.sbox:focus-within{border-color:var(--cyan)}
.sbox .ic{color:var(--tx3)}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;height:100%}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox button{color:var(--tx3);display:none}
.sbox.has button{display:grid}

.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border:0}
.row .cv{width:52px;height:52px;border-radius:10px;background:var(--s3) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--tx3)}
.row .m{min-width:0;flex:1}
.it1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it2{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;color:#fff;background:var(--req)}
.tag.b{background:var(--boost);color:#05070c}
.acts{display:flex;gap:6px;flex:none}
.btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s2);color:var(--tx)}
.btn:active{transform:scale(.94)}
.btn.add{background:var(--grad);color:#fff}
.btn.bst{color:var(--boost)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.done{background:#38e08a;color:#05070c}
.empty{color:var(--tx3);text-align:center;padding:22px 10px;font-size:14px;line-height:1.6}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--cyan);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}

/* Warteschlange als Fenster von unten */
.qov{position:fixed;inset:0;z-index:40;background:rgba(4,6,10,.72);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.qov.on{opacity:1;pointer-events:auto}
.qov .card{width:100%;max-width:560px;max-height:82vh;margin:0;border-radius:22px 22px 0 0;background:#121725;padding:8px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;transform:translateY(40px);transition:transform .25s}
.qov.on .card{transform:none}
.qov .grab{width:42px;height:5px;border-radius:999px;background:var(--s3);margin:2px auto 10px;flex:none}
.qov .h{flex:none}
.qov .x{width:36px;height:36px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--tx2)}
#qList{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--s3);border:1px solid var(--line);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
.gate b{font-size:22px}
.gate span{color:var(--tx2);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="lg" viewBox="-110 -110 220 220">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2ec8"/><stop offset=".55" stop-color="#8b5cff"/><stop offset="1" stop-color="#00f0e0"/></linearGradient></defs>
      <g class="ring"><circle r="100" fill="none" stroke="url(#g1)" stroke-width="12" stroke-dasharray="490 138" stroke-linecap="round"/></g>
      <g fill="url(#g1)" transform="translate(0 -8)"><rect x="-57" y="-36" width="18" height="62" rx="9"/><rect x="-31" y="-22" width="18" height="82" rx="9"/><rect x="-9" y="-8" width="18" height="88" rx="9"/><rect x="13" y="-22" width="18" height="82" rx="9"/><rect x="39" y="-36" width="18" height="62" rx="9"/></g>
    </svg>
    <div class="t"><b id="pTitle">PARTY-JUKEBOX</b><span id="pName">Wünscht euch euren Song</span></div>
    <div class="dot" id="dot"></div>
  </header>

  <div id="gate" class="gate"><div class="spin"></div><span>Verbinde mit der Party …</span></div>

  <div id="app" class="hide">
    <div class="card" id="nowCard">
      <div class="h"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Läuft gerade</div>
      <div class="now">
        <div class="cv" id="nCv"><div class="eqw"><i></i><i></i><i></i></div></div>
        <div class="m"><div class="ti" id="nTi">–</div><div class="ar" id="nAr"></div></div>
      </div>
      <div class="prog" id="nProg"><div class="trk"><div class="fill" id="nFill"></div></div><div class="times"><span id="nPos">0:00</span><span id="nDur">0:00</span></div></div>
      <button class="qbtn" id="qBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9"/><path d="M19 15v6M16 18h6"/></svg>Warteschlange<span class="c" id="qCnt2"></span><svg class="ic ar2" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    </div>

    <div class="quota">
      <div class="qt r" id="qtR"><div class="ib"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div><b id="qtRn">–</b><span id="qtRs">Wünsche frei</span></div></div>
      <div class="qt b" id="qtB"><div class="ib"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><b id="qtBn">–</b><span id="qtBs">Als Nächstes frei</span></div></div>
    </div>

    <div class="search"><div class="sbox" id="sbox">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Song oder Interpret suchen" autocomplete="off" enterkeyhint="search">
      <button id="qx" aria-label="Leeren"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div></div>

    <div class="card hide" id="resCard">
      <div class="h"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Suchergebnisse</div>
      <div id="res"></div>
    </div>
  </div>
</div>

<div class="qov" id="qOv">
  <div class="card" id="qCard">
    <div class="grab"></div>
    <div class="h"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h9"/><path d="M19 15v6M16 18h6"/></svg>Als Nächstes<span class="sp"></span><span id="qCnt" style="text-transform:none;letter-spacing:0"></span><button class="x" id="qClose" aria-label="Schließen"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="qList"><div class="spin"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<!-- Einstellungen aus dem Add-on (window.PJ), danach die Seiten-Skripte (Server liefert .js mit no-cache) -->
<script src="config.js"></script>
<script>
/* Titel aus den Add-on-Optionen */
(function(){ var n=(window.PJ&&window.PJ.name)||'Party-Jukebox'; document.title=n; document.getElementById('pTitle').textContent=n.toUpperCase(); })();
</script>
<script src="party.js"></script>
<script src="party-guests.js"></script>
<script src="party-extra.js"></script>
<script>
/* Warteschlange: Cover oder "Warteschlange" antippen → Fenster; X, Hintergrund oder Zurück-Taste schließt */
(function(){
var ovl=document.getElementById('qOv'), open=false;
function show(on){
  if(on===open) return; open=on;
  ovl.classList.toggle('on',on); document.body.classList.toggle('lock',on);
  if(on){ try{ history.pushState({q:1},''); }catch(e){} document.getElementById('qList').scrollTop=0; }
  else if(history.state&&history.state.q){ try{ history.back(); }catch(e){} }
}
document.getElementById('nCv').onclick=function(){ show(true); };
document.getElementById('qBtn').onclick=function(){ show(true); };
document.getElementById('qClose').onclick=function(){ show(false); };
ovl.addEventListener('click',function(e){ if(e.target===ovl) show(false); });
window.addEventListener('popstate',function(){ if(open){ open=false; ovl.classList.remove('on'); document.body.classList.remove('lock'); } });
var y0=null, card=document.getElementById('qCard');
card.addEventListener('touchstart',function(e){ var t=e.target; if(t.closest('#qList')&&document.getElementById('qList').scrollTop>0) return; y0=e.touches[0].clientY; },{passive:true});
card.addEventListener('touchmove',function(e){ if(y0==null) return; var d=e.touches[0].clientY-y0; if(d>0) card.style.transform='translateY('+d+'px)'; },{passive:true});
card.addEventListener('touchend',function(e){ if(y0==null) return; var d=(e.changedTouches[0].clientY-y0); y0=null; card.style.transform=''; if(d>90) show(false); });
var src=document.getElementById('qCnt'), dst=document.getElementById('qCnt2');
new MutationObserver(function(){ dst.textContent=src.textContent?'· '+src.textContent:''; }).observe(src,{childList:true,characterData:true,subtree:true});
})();
</script>
</body>
</html>
