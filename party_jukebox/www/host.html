<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Gastgeber</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
:root{--bg:#05070c;--s2:#1a2133;--line:rgba(255,255,255,.1);--tx:#fff;--tx2:#a9b1c7;--cyan:#00f0e0;--pink:#ff2ec8}
*{box-sizing:border-box;margin:0;padding:0;font-family:inherit;color:inherit}
html,body{height:100%}
body{background:radial-gradient(90vw 60vh at -10% -10%,rgba(255,46,200,.14),transparent 60%),radial-gradient(90vw 60vh at 110% 110%,rgba(0,240,224,.10),transparent 60%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:340px;text-align:center}
.lg{width:72px;height:72px;margin:0 auto 14px}
h1{font-size:22px;margin-bottom:6px}
p{color:var(--tx2);font-size:14px;line-height:1.5;margin-bottom:22px}
input{width:100%;height:58px;border-radius:16px;background:var(--s2);border:1px solid var(--line);outline:0;text-align:center;font-size:28px;letter-spacing:12px;font-weight:700;-webkit-appearance:none}
input:focus{border-color:var(--cyan)}
button{width:100%;height:54px;border:0;border-radius:16px;margin-top:12px;font-size:17px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,var(--pink),#8b5cff 55%,var(--cyan));color:#fff}
button:disabled{opacity:.5}
.err{min-height:20px;margin-top:12px;color:#ff6b6b;font-size:14px;font-weight:600}
a{display:inline-block;margin-top:14px;color:var(--tx2);font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <svg class="lg" viewBox="-110 -110 220 220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2ec8"/><stop offset=".55" stop-color="#8b5cff"/><stop offset="1" stop-color="#00f0e0"/></linearGradient></defs><circle r="100" fill="none" stroke="url(#g)" stroke-width="12"/><g fill="url(#g)" transform="translate(0 -8)"><rect x="-57" y="-36" width="18" height="62" rx="9"/><rect x="-31" y="-22" width="18" height="82" rx="9"/><rect x="-9" y="-8" width="18" height="88" rx="9"/><rect x="13" y="-22" width="18" height="82" rx="9"/><rect x="39" y="-36" width="18" height="62" rx="9"/></g></svg>
  <h1>Gastgeber</h1>
  <p>Die Jukebox ist mit einer PIN geschützt.<br>Dieses Gerät bleibt danach angemeldet.</p>
  <form id="f"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="••••" autofocus>
  <button id="ok" type="submit">Anmelden</button></form>
  <div class="err" id="err"></div>
  <a href="party.html">‹ Zur Gäste-Seite</a>
</div>
<script>
(function(){
  var nx=new URLSearchParams(location.search).get('next')||'jukebox.html';
  if(!/^[a-z0-9_-]+\.html$/i.test(nx)) nx='jukebox.html';
  function go(){ try{ localStorage.setItem('pj_host','1'); }catch(e){} location.replace(nx); }
  fetch('party/host?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){ if(!j.pin||j.host) go(); }).catch(function(){});
  var f=document.getElementById('f'), pin=document.getElementById('pin'), ok=document.getElementById('ok'), err=document.getElementById('err');
  f.onsubmit=function(e){
    e.preventDefault(); var v=pin.value.trim(); if(!v) return;
    ok.disabled=true; err.textContent='';
    fetch('party/host/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:v})})
      .then(function(r){ return r.json().then(function(j){ return [r.ok,j]; }); })
      .then(function(a){ if(a[0]&&a[1].ok) go(); else { err.textContent=a[1].error||'Falsche PIN'; pin.value=''; pin.focus(); } })
      .catch(function(){ err.textContent='Keine Verbindung'; })
      .then(function(){ ok.disabled=false; });
  };
})();
</script>
</body>
</html>
