<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Licht einstellen</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
/* Licht-Seite der Party-Jukebox: Govee-Lampen selbst einstellen. Farben wie die Jukebox (dunkel, Verlauf Pink → Blau). */
:root{--bg:#0b0d14;--card:#151926;--card2:#1c2133;--line:#262b3d;--tx:#eef0f6;--dim:#9aa1b6;--dim2:#6b7290;
  --a1:#e040fb;--a2:#29b6f6;--grad:linear-gradient(120deg,var(--a1),var(--a2));--ok:#5fd38d;--warn:#ffc400;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
main{max-width:760px;margin:0 auto}
a{color:var(--a2)}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header a.back{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--tx);font-size:20px}
h1{font-size:22px;margin:0;flex:1;min-width:0}
.sub{color:var(--dim);font-size:14px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.bar .grow{flex:1;min-width:160px}
.bar b{display:block}
.bar span.h{color:var(--dim);font-size:13px}
.sw{position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--a2)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.lamp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.lamp.dirty{border-color:var(--warn)}
.lamp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
.lamp>summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--dim2)}
.dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.wait{background:var(--warn)}
.sm{flex:1;min-width:0}
.sm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm span{color:var(--dim);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--dim);transition:transform .15s}
.lamp[open] .chev{transform:rotate(90deg)}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:block;font-size:14px;font-weight:600}
label.f small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.35}
input[type=text],input[type=number],select{width:100%;margin-top:5px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a2);outline-offset:1px}
.rg{display:flex;align-items:center;gap:10px;margin-top:5px}
.rg input[type=range]{flex:1;accent-color:var(--a2);height:30px}
.rg output{flex:none;min-width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-top:6px}
.chk input{width:20px;height:20px;accent-color:var(--a2)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.b{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
button.b.red{color:var(--bad)}
button.b.main{background:var(--grad);border:0;color:#fff}
button.b:disabled{opacity:.5;cursor:default}
#save{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(11,13,20,.94);border-top:1px solid var(--line);display:none;justify-content:center;gap:10px;backdrop-filter:blur(8px)}
#save.on{display:flex}
#save button{flex:1;max-width:340px}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.on{opacity:1}
.note{color:var(--dim);font-size:13px;margin:14px 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><a class="back" href="./" aria-label="Zurück zur Jukebox">‹</a><h1>Licht einstellen</h1></header>
<p class="sub">Govee-Lampen im Takt der Musik. Änderungen gelten sofort nach „Speichern“ – nur die geänderte Lampe startet kurz neu.</p>

<div class="bar">
  <div class="grow"><b>Licht im Takt</b><span class="h" id="onHint">–</span></div>
  <button class="sw" id="onSw" role="switch" aria-checked="false" aria-label="Licht im Takt"></button>
</div>

<div id="lamps"><p class="note">lädt …</p></div>

<div class="row">
  <button class="b" id="add">+ Lampe hinzufügen</button>
  <button class="b red" id="reset">Auf Add-on-Konfiguration zurücksetzen</button>
</div>
<p class="note" id="src"></p>
</main>

<div id="save"><button class="b" id="undo">Verwerfen</button><button class="b main" id="apply">Speichern &amp; anwenden</button></div>
<div id="msg" role="status" aria-live="polite"></div>

<script>
/* Lernkarte: Die Seite hält zwei Stände – „saved“ (so läuft es gerade im Add-on) und „lamps“ (was hier eingestellt ist).
   Weichen sie ab, erscheint unten „Speichern & anwenden“. Erst dann wird etwas an die Lampen geschickt. */
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let D = null, lamps = [], saved = [], openSet = new Set(), busy = false;

const EFF = { puls: "Puls – ganze Lampe blitzt auf den Schlag", welle: "Welle – Lauflicht auf den Gesang, Puls auf den Schlag",
  spektrum: "Spektrum – Bass bis Höhen nebeneinander", balken: "Balken – füllt sich mit der Lautstärke", ampel: "Ampel – Balken von Grün nach Rot" };
const PROTO = { standard: "Standard (die meisten Lampen)", razer: "Razer", dreams: "Dreams", v2: "V2 (neuere Modelle)",
  app: "App-Segmente (langsam, ca. 4 Bilder/s)", ganz: "Ganze Lampe in einer Farbe (weich)" };
const KEEP = [[0, "nie"], [2, "alle 2 s"], [10, "alle 10 s"], [20, "alle 20 s"], [60, "alle 60 s"]];
const blank = () => ({ name: "", ip: "", seg: 15, effect: "welle", brk: "", entity: "", delay: 0, dir: "", player: "", proto: "standard", keep: 0, color: "", floor: null, punch: null, strobe: true });
const strip = l => { const o = {}; for (const k of Object.keys(blank())) o[k] = l[k]; return o; };
const same = (a, b) => JSON.stringify(strip(a)) === JSON.stringify(strip(b));
const dirty = () => lamps.length !== saved.length || lamps.some((l, i) => !same(l, saved[i]));

function say(t) { const m = $("#msg"); m.textContent = t; m.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => m.classList.remove("on"), 3500); }

async function api(body) {
  const r = await fetch("party/licht", body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) { location.href = "host.html?next=licht.html"; throw new Error("Gastgeber-PIN nötig"); }
  if (!r.ok || j.ok === false) throw new Error(j.error || "Fehler " + r.status);
  return j;
}

function take(j) {
  D = j;
  saved = (j.lamps || []).map(l => Object.assign({}, l));
  lamps = saved.map(l => Object.assign({}, l));
  render();
}

function opt(list, val) { return list.map(([v, t]) => '<option value="' + esc(v) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(t) + "</option>").join(""); }

function title(l, i) { return l.name || (D.lights.find(x => x.id === (l.entity || "").split(",")[0]) || {}).name || l.ip || "Lampe " + (i + 1); }

function statusText(l) {
  const s = l.status;
  if (!s) return "neu – noch nicht gespeichert";
  if (!s.an) return "Licht im Takt ist aus";
  if (!s.verbunden) return "wartet auf Musik an „" + (s.folgt || "?") + "“";
  return "läuft · folgt „" + (s.folgt || "?") + "“";
}

function render() {
  $("#onSw").setAttribute("aria-checked", D.on ? "true" : "false");
  $("#onHint").textContent = D.on ? "an – die Lampen folgen der Musik" : "aus – die Lampen gehören wieder Home Assistant";
  $("#src").textContent = D.quelle === "seite"
    ? "Es gelten die Einstellungen dieser Seite. Die Lampen-Zeilen in der Add-on-Konfiguration werden nicht mehr benutzt."
    : "Noch gilt die Add-on-Konfiguration. Mit dem ersten Speichern übernimmt diese Seite.";
  const players = [["", "Standard" + (D.standard_player ? " (" + D.standard_player + ")" : "")]].concat(D.players.map(p => [p, p]));
  const box = $("#lamps");
  if (!lamps.length) { box.innerHTML = '<p class="note">Noch keine Lampe eingerichtet.</p>'; $("#save").classList.toggle("on", dirty()); return; }
  box.innerHTML = lamps.map((l, i) => {
    const s = l.status, cls = !s ? "wait" : s.an && s.verbunden ? "run" : s.an ? "wait" : "";
    const pl = players.some(p => p[0] === l.player) ? players : players.concat([[l.player, l.player + " (nicht gefunden)"]]);
    const auto = k => l[k] == null;
    return '<details class="lamp' + (saved[i] && same(l, saved[i]) ? "" : " dirty") + '" data-i="' + i + '"' + (openSet.has(i) ? " open" : "") + '>' +
      '<summary><span class="dot ' + cls + '"></span><span class="sm"><b>' + esc(title(l, i)) + '</b><span>' + esc(EFF[l.effect].split(" – ")[0]) + " · " + esc(statusText(l)) + '</span></span><span class="chev">›</span></summary>' +
      '<div class="body">' +
      '<h3>Wirkung</h3><div class="grid">' +
        '<label class="f">Effekt<select data-k="effect">' + opt(D.effects.map(e => [e, EFF[e] || e]), l.effect) + '</select></label>' +
        '<label class="f">Effekt ohne Bass-Beat<select data-k="brk">' + opt([["", "wie sonst, nur ohne Aufblitzen"]].concat(D.effects.map(e => [e, (EFF[e] || e).split(" – ")[0]])), l.brk) + '</select><small>In ruhigen Stellen ohne Bass-Schlag.</small></label>' +
        '<label class="f">Farbe<select data-k="color">' + opt([["", "eigene Farbfolge"], ["raum", "Raumfarbe – wechselt gemeinsam"], ["gegen", "Gegenfarbe zur Raumfarbe"]], l.color) + '</select><small>Raum = alle Lampen am selben Lautsprecher.</small></label>' +
        '<label class="f">Richtung<select data-k="dir">' + opt([["", "normal"], ["umdrehen", "umgedreht"], ["spiegeln", "an der Mitte gespiegelt"]], l.dir) + '</select><small>Gespiegelt: für Rahmen und Bögen, beide Enden zeigen dasselbe.</small></label>' +
      '</div>' +
      '<h3>Stärke</h3><div class="grid">' +
        '<div><label class="chk"><input type="checkbox" data-auto="floor"' + (auto("floor") ? " checked" : "") + '>Grundleuchten automatisch</label>' +
          '<div class="rg"><input type="range" min="0" max="80" step="1" data-k="floor" aria-label="Grundleuchten" value="' + (auto("floor") ? 28 : l.floor) + '"' + (auto("floor") ? " disabled" : "") + '><output>' + (auto("floor") ? "auto" : l.floor + " %") + '</output></div>' +
          '<label class="f"><small>Wie hell die Lampe zwischen zwei Schlägen bleibt. 0 % = geht aus.</small></label></div>' +
        '<div><label class="chk"><input type="checkbox" data-auto="punch"' + (auto("punch") ? " checked" : "") + '>Schlag-Stärke automatisch</label>' +
          '<div class="rg"><input type="range" min="20" max="100" step="1" data-k="punch" aria-label="Schlag-Stärke" value="' + (auto("punch") ? 100 : l.punch) + '"' + (auto("punch") ? " disabled" : "") + '><output>' + (auto("punch") ? "auto" : l.punch + " %") + '</output></div>' +
          '<label class="f"><small>Wie hell der Schlag wird. Großer Abstand zum Grundleuchten = kräftiges Pulsieren.</small></label></div>' +
        '<div><label class="f">Feinabgleich</label><div class="rg"><input type="range" min="-800" max="400" step="10" data-k="delay" aria-label="Feinabgleich" value="' + l.delay + '"><output>' + l.delay + ' ms</output></div>' +
          '<label class="f"><small>Minus = Licht früher, Plus = später. Wenn der Blitz dem Schlag hinterherhinkt: weiter ins Minus.</small></label></div>' +
        '<div><label class="chk"><input type="checkbox" data-k="strobe"' + (l.strobe ? " checked" : "") + '>Strobe im Aufbau</label><label class="f"><small>Weißes Blitzen vor dem Bass-Einsatz. Aus = die Lampe bleibt bei ihrem Effekt.</small></label></div>' +
      '</div>' +
      '<h3>Lampe</h3><div class="grid">' +
        '<label class="f">Name<input type="text" data-k="name" maxlength="40" value="' + esc(l.name) + '" placeholder="' + esc(title(Object.assign({}, l, { name: "" }), i)) + '"></label>' +
        '<label class="f">Lautsprecher<select data-k="player">' + opt(pl, l.player) + '</select><small>Welcher Musik die Lampe folgt.</small></label>' +
        '<label class="f">IP-Adresse<input type="text" data-k="ip" inputmode="decimal" value="' + esc(l.ip) + '" placeholder="192.168.178.…"><small>Aus der FritzBox. LAN-Steuerung muss in der Govee-App an sein.</small></label>' +
        '<label class="f">Segmente<input type="number" data-k="seg" min="1" max="60" value="' + l.seg + '"><small>Wie in der Govee-App.</small></label>' +
        '<label class="f">Lampe in Home Assistant<input type="text" data-k="entity" list="lights" value="' + esc(l.entity) + '" placeholder="light.…"><small>Zum Einschalten und um danach den alten Zustand wiederherzustellen.</small></label>' +
      '</div>' +
      '<h3>Technik</h3><div class="grid">' +
        '<label class="f">Paket-Form<select data-k="proto">' + opt(D.protos.map(p => [p, PROTO[p] || p]), l.proto) + '</select><small>Reagiert die Lampe nicht, eine andere Form probieren.</small></label>' +
        '<label class="f">Echtzeit-Modus auffrischen<select data-k="keep">' + opt(KEEP.some(k => k[0] === l.keep) ? KEEP : KEEP.concat([[l.keep, "alle " + l.keep + " s"]]), l.keep) + '</select><small>Fällt die Lampe nach einer Weile aus dem Takt-Licht: auffrischen. Zuckt sie regelmäßig: seltener oder nie.</small></label>' +
      '</div>' +
      '<div class="row"><button class="b" data-act="test"' + (l.nr && saved[i] && same(l, saved[i]) ? "" : " disabled") + '>Testmuster zeigen</button><button class="b red" data-act="del">Lampe entfernen</button></div>' +
      '</div></details>';
  }).join("") + '<datalist id="lights">' + D.lights.map(x => '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>").join("") + "</datalist>";
  $("#save").classList.toggle("on", dirty());
}

function mark() {   /* nach einer Eingabe: nur Rahmen und Speichern-Leiste nachziehen – nicht neu zeichnen (sonst springt der Regler weg) */
  document.querySelectorAll(".lamp").forEach(el => { const i = +el.dataset.i; el.classList.toggle("dirty", !(saved[i] && same(lamps[i], saved[i]))); });
  $("#save").classList.toggle("on", dirty());
}

const box = $("#lamps");
box.addEventListener("toggle", e => { const el = e.target.closest(".lamp"); if (el) { const i = +el.dataset.i; if (el.open) openSet.add(i); else openSet.delete(i); } }, true);
box.addEventListener("input", e => {
  const el = e.target.closest(".lamp"); if (!el) return;
  const l = lamps[+el.dataset.i], t = e.target, k = t.dataset.k, a = t.dataset.auto;
  if (a) {   /* Haken „automatisch“ schaltet den Regler daneben ein/aus */
    const r = el.querySelector('input[type=range][data-k="' + a + '"]');
    l[a] = t.checked ? null : +r.value; r.disabled = t.checked; r.nextElementSibling.textContent = t.checked ? "auto" : r.value + " %";
  } else if (k) {
    if (t.type === "checkbox") l[k] = t.checked;
    else if (t.type === "range") { l[k] = +t.value; t.nextElementSibling.textContent = t.value + (k === "delay" ? " ms" : " %"); }
    else if (k === "seg" || k === "keep") l[k] = Math.round(+t.value) || 0;
    else l[k] = t.value.trim();
  }
  mark();
});
box.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = +b.closest(".lamp").dataset.i;
  if (b.dataset.act === "del") {
    if (!confirm("„" + title(lamps[i], i) + "“ entfernen? Das gilt erst nach „Speichern & anwenden“.")) return;
    lamps.splice(i, 1); openSet = new Set(); render();
  } else if (b.dataset.act === "test") {
    try { await api({ test: lamps[i].nr }); say("Testmuster läuft – Balken füllt sich einmal und leert sich wieder"); } catch (x) { say(x.message); }
  }
});

$("#add").onclick = () => { lamps.push(blank()); openSet.add(lamps.length - 1); render(); document.querySelector('.lamp:last-of-type input[data-k="ip"]').focus(); };
$("#undo").onclick = () => { lamps = saved.map(l => Object.assign({}, l)); render(); };
$("#apply").onclick = async () => {
  if (busy) return;
  const bad = lamps.findIndex(l => !l.ip);
  if (bad >= 0) { openSet.add(bad); render(); say("Bei „" + title(lamps[bad], bad) + "“ fehlt die IP-Adresse"); return; }
  busy = true; $("#apply").disabled = true; $("#apply").textContent = "Wird angewendet …";
  try { take(await api({ lamps: lamps.map(strip) })); say("Gespeichert – geänderte Lampen starten neu"); setTimeout(refresh, 4000); }
  catch (x) { say("Nicht gespeichert: " + x.message); }
  busy = false; $("#apply").disabled = false; $("#apply").textContent = "Speichern & anwenden";
};
$("#reset").onclick = async () => {
  if (!confirm("Alle Einstellungen dieser Seite verwerfen und wieder die Lampen aus der Add-on-Konfiguration nehmen?")) return;
  try { take(await api({ reset: true })); say("Zurückgesetzt"); } catch (x) { say(x.message); }
};
$("#onSw").onclick = async () => {
  const on = !D.on;
  try {
    const r = await fetch("party/light", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on }) });
    if (!r.ok) throw new Error("Fehler " + r.status);
    D.on = on; render(); setTimeout(refresh, 2500);
  } catch (x) { say(x.message); }
};

/* Status alle paar Sekunden auffrischen – aber nur, solange nichts Ungespeichertes offen ist */
async function refresh() { if (busy || dirty() || document.hidden) return; try { take(await api()); } catch (x) {} }
setInterval(refresh, 8000);
api().then(take).catch(x => { $("#lamps").innerHTML = '<p class="note">Konnte nicht laden: ' + esc(x.message) + "</p>"; });
</script>
</body>
</html>
