configuration:
  ma_url:
    name: Music-Assistant-Adresse
    description: Leer lassen, dann wird das Music-Assistant-Add-on automatisch gefunden. Sonst z. B. http://192.168.1.10:8095
  ma_token:
    name: Music-Assistant-Token
    description: In Music Assistant unter Einstellungen → Profil einen Token erstellen und hier einfügen.
  party_name:
    name: Party-Name
    description: Titel auf TV-Anzeige und Party-Seite.
  party_player:
    name: Party-Player
    description: Music-Assistant-Player (Name oder ID) für TV und Jukebox. Leer = der gerade spielende Player.
  notify_service:
    name: Benachrichtigung für Nachschub
    description: z. B. notify.mobile_app_mein_iphone – bestellt ein Gast ein Getränk, kommt eine Nachricht (Android, iPhone, Uhr). Mehrere mit Komma trennen. Leer = aus.
  script_wish:
    name: Skript bei Wunsch
    description: Optionales HA-Skript (z. B. script.lichteffekt_wunsch), das bei einem neuen Songwunsch läuft.
  script_boost:
    name: Skript bei Vordrängeln
    description: Optionales HA-Skript, das läuft, wenn sich jemand vordrängelt.
  script_drink:
    name: Skript bei Nachschub
    description: Optionales HA-Skript, das bei einer Getränkebestellung läuft.
  skip_votes:
    name: Abstimmung überspringt Songs
    description: Stimmt die Mehrheit der Gäste 👎, wird der laufende Song übersprungen.
  tv_cast_entity:
    name: TV-Ton – Cast-Player
    description: Optional. Cast-Player des TV-Geräts (z. B. media_player.wohnzimmer_tv_cast). Läuft TV-Ton über eine Soundbar, zeigt die Jukebox Sender, Sendung bzw. App von hier.
  tv_box_entities:
    name: TV-Ton – weitere Player
    description: Optional, mit Komma getrennt (z. B. Android-TV- oder Fire-TV-Box) – liefern den App-Namen, wenn der Cast-Player nichts meldet.
  tv_logo_index:
    name: TV-Ton – Senderlogo-Liste
    description: Optional. /local/...js mit Zuordnung Sendername → Logodatei (z. B. /local/senderlogos-index.js).
  tv_logo_dir:
    name: TV-Ton – Senderlogo-Ordner
    description: Optional. Ordner der Logodateien unter /local (z. B. /local/senderlogos/senderlogos).
  drinks:
    name: Getränke
    description: Eine Zeile pro Getränk im Format Name|Emoji|Satz, z. B. Bier|🍺|ein Bier
network:
  8099/tcp: Webseiten (Jukebox, Party-Seite, TV-Anzeige) im Heimnetz
