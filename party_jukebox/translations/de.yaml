configuration:
  ma_url:
    name: Music-Assistant-Adresse
    description: Leer lassen, dann wird das Music-Assistant-Add-on automatisch gefunden. Sonst z. B. http://192.168.1.10:8095
  ma_token:
    name: Music-Assistant-Token
    description: In Music Assistant unter Einstellungen → Profil einen Token erstellen und hier einfügen.
  party_name:
    name: Party-Name
    description: Titel auf TV-Anzeige und Party-Seite.
  party_player:
    name: Party-Player
    description: Music-Assistant-Player (Name oder ID) für TV und Jukebox. Leer = der gerade spielende Player.
  notify_service:
    name: Benachrichtigung für Nachschub
    description: z. B. notify.mobile_app_mein_iphone – bestellt ein Gast ein Getränk, kommt eine Nachricht (Android, iPhone, Uhr). Mehrere mit Komma trennen. Leer = aus.
  script_wish:
    name: Skript bei Wunsch
    description: Optionales HA-Skript (z. B. script.lichteffekt_wunsch), das bei einem neuen Songwunsch läuft.
  script_boost:
    name: Skript bei Vordrängeln
    description: Optionales HA-Skript, das läuft, wenn sich jemand vordrängelt.
  script_drink:
    name: Skript bei Nachschub
    description: Optionales HA-Skript, das bei einer Getränkebestellung läuft.
  skip_votes:
    name: Abstimmung überspringt Songs
    description: Stimmt die Mehrheit der Gäste 👎, wird der laufende Song übersprungen.
  tv_cast_entity:
    name: TV-Ton – Cast-Player
    description: Optional. Cast-Player des TV-Geräts (z. B. media_player.wohnzimmer_tv_cast). Läuft TV-Ton über eine Soundbar, zeigt die Jukebox Sender, Sendung bzw. App von hier.
  tv_box_entities:
    name: TV-Ton – weitere Player
    description: Optional, mit Komma getrennt (z. B. Android-TV- oder Fire-TV-Box) – liefern den App-Namen, wenn der Cast-Player nichts meldet.
  tv_logo_index:
    name: TV-Ton – Senderlogo-Liste
    description: Optional. /local/...js mit Zuordnung Sendername → Logodatei (z. B. /local/senderlogos-index.js).
  tv_logo_dir:
    name: TV-Ton – Senderlogo-Ordner
    description: Optional. Ordner der Logodateien unter /local (z. B. /local/senderlogos/senderlogos).
  app_update_package:
    name: App-Updates – App-Kennung
    description: Optional. Paketname der Android-App (z. B. de.partyjukebox.player). Bei einer neuen App-Version kommt eine Benachrichtigung; Antippen öffnet die App.
  dmx_host:
    name: DMX-Licht – Adresse des Art-Net-Knotens
    description: Optional. IP-Adresse oder Name eines Art-Net-Empfängers (z. B. ESP32 mit LuxDMX, dmx-gateway.local). Das Licht läuft dann im Takt der Musik. Leer = aus.
  dmx_universe:
    name: DMX-Licht – Universum
    description: Art-Net-Universum des Knotens (meist 0).
  dmx_channels:
    name: DMX-Licht – Kanäle der Lampe
    description: 'Welche DMX-Kanäle die Lampe hat, z. B. dimmer=1,r=2,g=3,b=4,w=5. Möglich: dimmer, r, g, b, w, strobe. Feste Werte als Kanal=Wert, z. B. 6=255. Leer = r=1,g=2,b=3.'
  dmx_player:
    name: DMX-Licht – folgt diesem Lautsprecher
    description: Music-Assistant-Player (Name oder ID), dem das Licht folgt. Leer = Party-Player.
  dmx_effect:
    name: DMX-Licht – Effekt
    description: beat = Puls auf jeden Schlag mit Farbwechsel · smooth = folgt der Lautstärke · color = nur Farbwechsel.
  dmx_delay_ms:
    name: DMX-Licht – Feinabgleich (ms)
    description: Kommt das Licht zu früh, positive Zahl eintragen (z. B. 150); kommt es zu spät, negative Zahl.
  dmx_fixtures:
    name: DMX-Licht – mehrere Geräte
    description: 'Optional, statt „Kanäle der Lampe“. Eine Zeile pro Gerät: Name | Art | Kanäle | Dauer. Arten: beat, smooth, color (Licht) · drop (nur beim Drop) · music (nur solange Musik läuft). Beispiele: „Spot | beat | dimmer=1,r=2,g=3,b=4,strobe=5“ · „Nebel | drop | 10=255 | 3s“ · „Laser | music | 20=255“. Ein Strobe-Kanal am Licht wird nur beim Drop benutzt.'
  dmx_drop_seconds:
    name: DMX-Licht – Drop-Dauer (s)
    description: So lange laufen Strobe und Drop-Geräte nach einem erkannten Drop (Standard 4). Je Gerät überschreibbar mit der Dauer in der Geräte-Zeile.
  dmx_drop_build:
    name: DMX-Licht – Drop-Aufbau (s)
    description: So lange muss der Bass vorher mindestens weg sein, damit es als Drop zählt (Standard 6). Größer = nur lange Aufbauten.
  dmx_drop_sensitivity:
    name: DMX-Licht – Drop-Empfindlichkeit
    description: 1 bis 10 (Standard 5). Höher = erkennt auch schwächere Drops, aber mehr Fehlalarme.
  dmx_drop_cooldown:
    name: DMX-Licht – Drop-Pause (s)
    description: Frühestens nach so vielen Sekunden wird der nächste Drop ausgelöst (Standard 30).
  dmx_strobe_value:
    name: DMX-Licht – Strobe-Wert
    description: Wert des Strobe-Kanals während des Drops, 0–255 (Standard 200). 0 = kein Strobe.
  light_switch:
    name: Licht – eigener Schalter
    description: Optional. Entität aus Home Assistant (z. B. input_boolean.musik_sync_diskokugel), die DMX- und WLED-Licht ein- und ausschaltet. Leer = das Add-on legt selbst den Helfer input_boolean.party_jukebox_licht an.
  wled_host:
    name: WLED-Licht – Adresse(n)
    description: Optional. IP-Adresse(n) von WLED-Geräten, mit Komma getrennt. WLEDs Musik-Effekte bekommen ihre Daten dann aus Music Assistant statt von einem Mikrofon. In WLED unter Usermods → AudioReactive den Sync-Modus „Receive“ einstellen. Leer = aus.
  wled_port:
    name: WLED-Licht – Port
    description: Port aus WLEDs AudioReactive-Sync-Einstellung (Standard 11988).
  wled_player:
    name: WLED-Licht – folgt diesem Lautsprecher
    description: Music-Assistant-Player (Name oder ID), dem das Licht folgt. Leer = Party-Player.
  wled_gain_db:
    name: WLED-Licht – Empfindlichkeit (dB)
    description: Standard 6. Höher, wenn die Effekte flau wirken; niedriger, wenn sie dauernd am Anschlag sind.
  wled_delay_ms:
    name: WLED-Licht – Feinabgleich (ms)
    description: Kommt das Licht zu früh, positive Zahl eintragen (z. B. 150); kommt es zu spät, negative Zahl.
  ha_lights:
    name: Lampen aus Home Assistant – Liste
    description: Optional. Farb-Lampen aus Home Assistant (Shelly RGBW, Govee, Hue …), mit Komma getrennt, z. B. „light.stehleuchte, light.sofa“. Farbe wechselt im Takt, Helligkeit folgt der Lautstärke. Eigener Takt je Lampe mit „=Millisekunden“, z. B. „light.lampions=1000“ für Cloud-Lampen. Pegel-Balken für Lampen mit Segmenten – „light.stehleuchte=balken“ (Farbe im Takt) oder „=ampel“ (grün → rot). Der Zustand vorher wird gemerkt und danach wiederhergestellt. Leer = aus.
  ha_lights_player:
    name: Lampen aus Home Assistant – folgt diesem Lautsprecher
    description: Music-Assistant-Player (Name oder ID), dem das Licht folgt. Leer = wie WLED/DMX bzw. Party-Player.
  ha_lights_ms:
    name: Lampen aus Home Assistant – Abstand (ms)
    description: Mindestabstand zwischen zwei Befehlen je Lampe. Standard 500. Lokale Lampen (Shelly, Govee mit LAN-Steuerung) vertragen 300–500, Cloud-Lampen eher 1000.
  govee_host:
    name: Govee-Licht – Adresse(n)
    description: Optional. IP-Adresse(n) von Govee-Lampen mit Segmenten, mit Komma getrennt. Die Lampe zeigt dann einen Pegel-Balken oder ein Spektrum – direkt im Heimnetz, ohne Cloud. In der Govee-App muss „LAN-Steuerung“ eingeschaltet sein. Dieselbe Lampe nicht zusätzlich bei „Lampen aus Home Assistant“ eintragen. Leer = aus.
  govee_segments:
    name: Govee-Licht – Anzahl Segmente
    description: Standard 7.
  govee_effect:
    name: Govee-Licht – Effekt
    description: balken = je lauter, desto mehr Segmente, Farbe wechselt im Takt. ampel = Balken grün → rot. spektrum = jedes Segment ein Frequenzband (Bass bis Höhen).
  govee_reverse:
    name: Govee-Licht – umdrehen
    description: Einschalten, wenn der Balken verkehrt herum läuft.
  govee_entity:
    name: Govee-Licht – Lampe in Home Assistant
    description: Optional. Dieselbe Lampe als Home-Assistant-Entität, z. B. „light.stehleuchte“. Geht der Licht-Schalter an, schaltet das Add-on die Lampe ein; danach stellt es den Zustand von vorher wieder her (war sie aus, geht sie wieder aus).
  govee_player:
    name: Govee-Licht – folgt diesem Lautsprecher
    description: Music-Assistant-Player (Name oder ID), dem das Licht folgt. Leer = wie WLED/DMX bzw. Party-Player.
  govee_delay_ms:
    name: Govee-Licht – Feinabgleich (ms)
    description: Kommt das Licht zu früh, positive Zahl eintragen (z. B. 150); kommt es zu spät, negative Zahl.
  viz_probe:
    name: Diagnose Licht-Daten
    description: Nur für die Fehlersuche. Leer lassen.
  drinks:
    name: Getränke
    description: Eine Zeile pro Getränk im Format Name|Emoji|Satz, z. B. Bier|🍺|ein Bier
  app_update_repo:
    name: App-Updates – GitHub-Repository
    description: "Optional. Repository der Android-App mit Releases, z. B. benutzer/meine-app. Die App holt neue Versionen dann selbst über das Add-on."
  app_update_token:
    name: App-Updates – GitHub-Token
    description: "Optional, nur für private Repositories: Fine-grained Token mit Lesezugriff auf „Contents“ dieses Repositories. Bleibt nur in Home Assistant."
network:
  8099/tcp: Webseiten (Jukebox, Party-Seite, TV-Anzeige) im Heimnetz
