configuration:
  ma_url:
    name: Music Assistant URL
    description: Leave empty to detect the Music Assistant add-on automatically. Otherwise e.g. http://192.168.1.10:8095
  ma_token:
    name: Music Assistant token
    description: Create a token in Music Assistant under Settings → Profile and paste it here.
  party_name:
    name: Party name
    description: Title shown on the TV display and the party page.
  party_player:
    name: Party player
    description: Music Assistant player (name or ID) for TV and jukebox. Empty = the player currently playing.
  notify_service:
    name: Drink order notification
    description: e.g. notify.mobile_app_my_iphone – you get a message when a guest orders a drink (Android, iPhone, watch). Separate several with commas. Empty = off.
  script_wish:
    name: Script on song wish
    description: Optional HA script (e.g. a light effect) that runs when a guest wishes a song.
  script_boost:
    name: Script on queue jump
    description: Optional HA script that runs when a guest jumps the queue.
  script_drink:
    name: Script on drink order
    description: Optional HA script that runs when a guest orders a drink.
  skip_votes:
    name: Votes skip songs
    description: Skip the current song when the majority of guests vote 👎.
  tv_cast_entity:
    name: TV audio – Cast player
    description: Optional. Cast player of the TV device. When a soundbar plays TV audio, the jukebox shows channel, programme or app from here.
  tv_box_entities:
    name: TV audio – more players
    description: Optional, comma separated (e.g. Android TV / Fire TV box) – provide the app name if the Cast player reports nothing.
  tv_logo_index:
    name: TV audio – channel logo list
    description: Optional. /local/...js mapping channel name → logo file.
  tv_logo_dir:
    name: TV audio – channel logo folder
    description: Optional. Folder of the logo files under /local.
  app_update_package:
    name: App updates – package name
    description: Optional. Package name of the Android app (e.g. de.partyjukebox.player). A new app version triggers a notification; tapping it opens the app.
  dmx_host:
    name: DMX light – Art-Net node address
    description: Optional. IP address or name of an Art-Net receiver (e.g. ESP32 with LuxDMX, dmx-gateway.local). The light then follows the beat of the music. Empty = off.
  dmx_universe:
    name: DMX light – universe
    description: Art-Net universe of the node (usually 0).
  dmx_channels:
    name: DMX light – fixture channels
    description: 'DMX channels of the fixture, e.g. dimmer=1,r=2,g=3,b=4,w=5. Roles: dimmer, r, g, b, w, strobe. Fixed values as channel=value, e.g. 6=255. Empty = r=1,g=2,b=3.'
  dmx_player:
    name: DMX light – follows this speaker
    description: Music Assistant player (name or ID) the light follows. Empty = party player.
  dmx_effect:
    name: DMX light – effect
    description: beat = pulse on every beat with colour change · smooth = follows loudness · color = colour change only.
  dmx_delay_ms:
    name: DMX light – fine tuning (ms)
    description: Light too early → positive number (e.g. 150); too late → negative number.
  dmx_fixtures:
    name: DMX light – several fixtures
    description: 'Optional, replaces "fixture channels". One line per fixture: name | kind | channels | duration. Kinds: beat, smooth, color (light) · drop (only on a drop) · music (only while music plays). Examples: "Spot | beat | dimmer=1,r=2,g=3,b=4,strobe=5" · "Fog | drop | 10=255 | 3s" · "Laser | music | 20=255". A strobe channel on a light is only used on a drop.'
  dmx_drop_seconds:
    name: DMX light – drop duration (s)
    description: How long strobe and drop fixtures run after a detected drop (default 4). Can be overridden per fixture.
  dmx_drop_build:
    name: DMX light – drop build-up (s)
    description: Minimum time the bass must be gone before it counts as a drop (default 6).
  dmx_drop_sensitivity:
    name: DMX light – drop sensitivity
    description: 1 to 10 (default 5). Higher = detects weaker drops but more false alarms.
  dmx_drop_cooldown:
    name: DMX light – drop cooldown (s)
    description: Earliest time until the next drop is triggered (default 30).
  dmx_strobe_value:
    name: DMX light – strobe value
    description: Value of the strobe channel during a drop, 0–255 (default 200). 0 = no strobe.
  light_switch:
    name: Light – own switch
    description: Optional. Home Assistant entity (e.g. input_boolean.my_light_sync) that switches DMX and WLED light on and off. Empty = the add-on creates the helper input_boolean.party_jukebox_licht itself.
  wled_host:
    name: WLED light – address(es)
    description: Optional. IP address(es) of WLED devices, comma separated. WLED's audio-reactive effects then get their data from Music Assistant instead of a microphone. In WLED set Usermods → AudioReactive sync mode to "Receive". Empty = off.
  wled_port:
    name: WLED light – port
    description: Port from WLED's AudioReactive sync setting (default 11988).
  wled_player:
    name: WLED light – follows this speaker
    description: Music Assistant player (name or ID) the light follows. Empty = party player.
  wled_gain_db:
    name: WLED light – sensitivity (dB)
    description: Default 6. Higher if effects look flat, lower if they are stuck at maximum.
  wled_delay_ms:
    name: WLED light – fine tuning (ms)
    description: Light too early → positive number (e.g. 150); too late → negative number.
  ha_lights:
    name: Home Assistant lights – list
    description: Optional. Colour lights from Home Assistant (Shelly RGBW, Govee, Hue …), comma separated, e.g. "light.floor_lamp, light.sofa". Colour changes with the beat, brightness follows loudness. Per-light interval with "=milliseconds", e.g. "light.lanterns=1000" for cloud lights. Level bar for lights with segments – "light.floor_lamp=balken" (beat colour) or "=ampel" (green → red). The previous state is saved and restored afterwards. Empty = off.
  ha_lights_player:
    name: Home Assistant lights – follows this speaker
    description: Music Assistant player (name or id) the lights follow. Empty = same as WLED/DMX or the party player.
  ha_lights_ms:
    name: Home Assistant lights – interval (ms)
    description: Minimum gap between two commands per light. Default 500. Local lights (Shelly, Govee with LAN control) handle 300–500, cloud lights rather 1000.
  govee_host:
    name: Govee light – address(es)
    description: Optional. IP address(es) of Govee lights with segments, comma separated. The light then shows a level bar or spectrum – directly on the LAN, no cloud. "LAN control" must be enabled in the Govee app. Do not also list the same light under "Home Assistant lights". Empty = off.
  govee_segments:
    name: Govee light – number of segments
    description: Default 7.
  govee_effect:
    name: Govee light – effect
    description: balken = the louder, the more segments, colour changes with the beat. ampel = bar green → red. spektrum = each segment one frequency band (bass to treble). puls = like the DMX spot – the whole light flashes on every beat.
  govee_break:
    name: Govee light – effect while the bass is out
    description: When the bass drops out (break, build-up, quiet part) the light shows this effect instead of the normal one – e.g. "ampel"; the bar then follows vocals/melody. When the bass returns the normal effect resumes. Empty = always the normal effect.
  govee_strobe:
    name: Govee light – strobe on drop
    description: When the bass drops out for a while and comes back (drop), the light flashes white for a few seconds. Default on. Detection and duration as for the DMX light. Test – long-press the light button in the speaker list.
  govee_strobe_seconds:
    name: Govee light – strobe duration (s)
    description: How long the light flashes after a drop. Default 8.
  govee_reverse:
    name: Govee light – reverse
    description: Enable if the bar runs upside down.
  govee_entity:
    name: Govee light – entity in Home Assistant
    description: Optional. The same light as a Home Assistant entity, e.g. "light.floor_lamp". The add-on turns the light on when the light switch goes on and restores the previous state afterwards (if it was off, it goes off again).
  govee_lamps:
    name: Govee light – more lights
    description: Each additional light gets its own role. Per line – IP | segments | effect | Home Assistant entity | fine tuning ms | effect without bass beat | reverse. Only the IP is required. Example "192.168.178.164 | 20 | welle | light.sofa | -250". Effects – balken, ampel, spektrum, puls, welle (bass wave + sparkle, for many segments).
  govee_player:
    name: Govee light – follows this speaker
    description: Music Assistant player (name or id) the light follows. Empty = same as WLED/DMX or the party player.
  govee_delay_ms:
    name: Govee light – fine tuning (ms)
    description: Light too early → positive number (e.g. 150); too late → negative number.
  viz_probe:
    name: Light data diagnostics
    description: Troubleshooting only. Leave empty.
  drinks:
    name: Drinks
    description: One line per drink in the format Name|Emoji|Phrase, e.g. Beer|🍺|a beer
  app_update_repo:
    name: App updates – GitHub repository
    description: "Optional. Repository of the Android app with releases, e.g. user/my-app. The app then fetches new versions itself through the add-on."
  app_update_token:
    name: App updates – GitHub token
    description: "Optional, only for private repositories: fine-grained token with read access to this repository's contents. Stays in Home Assistant only."
network:
  8099/tcp: Web pages (jukebox, party page, TV display) on your home network
