configuration:
  ma_url:
    name: Music Assistant URL
    description: Leave empty to detect the Music Assistant add-on automatically. Otherwise e.g. http://192.168.1.10:8095
  ma_token:
    name: Music Assistant token
    description: Create a token in Music Assistant under Settings → Profile and paste it here.
  party_name:
    name: Party name
    description: Title shown on the TV display and the party page.
  party_player:
    name: Party player
    description: Music Assistant player (name or ID) for TV and jukebox. Empty = the player currently playing.
  notify_service:
    name: Drink order notification
    description: e.g. notify.mobile_app_my_iphone – you get a message when a guest orders a drink (Android, iPhone, watch). Separate several with commas. Empty = off.
  script_wish:
    name: Script on song wish
    description: Optional HA script (e.g. a light effect) that runs when a guest wishes a song.
  script_boost:
    name: Script on queue jump
    description: Optional HA script that runs when a guest jumps the queue.
  script_drink:
    name: Script on drink order
    description: Optional HA script that runs when a guest orders a drink.
  skip_votes:
    name: Votes skip songs
    description: Skip the current song when the majority of guests vote 👎.
  tv_cast_entity:
    name: TV audio – Cast player
    description: Optional. Cast player of the TV device. When a soundbar plays TV audio, the jukebox shows channel, programme or app from here.
  tv_box_entities:
    name: TV audio – more players
    description: Optional, comma separated (e.g. Android TV / Fire TV box) – provide the app name if the Cast player reports nothing.
  tv_logo_index:
    name: TV audio – channel logo list
    description: Optional. /local/...js mapping channel name → logo file.
  tv_logo_dir:
    name: TV audio – channel logo folder
    description: Optional. Folder of the logo files under /local.
  drinks:
    name: Drinks
    description: One line per drink in the format Name|Emoji|Phrase, e.g. Beer|🍺|a beer
  tts_engine:
    name: Announcement – TTS engine
    description: "Optional, e.g. tts.home_assistant_cloud or tts.piper. Empty = automatic. Used for the queue-jump announcement on the speaker."
  app_update_repo:
    name: App updates – GitHub repository
    description: "Optional. Repository of the Android app with releases, e.g. user/my-app. The app then fetches new versions itself through the add-on."
  app_update_token:
    name: App updates – GitHub token
    description: "Optional, only for private repositories: fine-grained token with read access to this repository's contents. Stays in Home Assistant only."
network:
  8099/tcp: Web pages (jukebox, party page, TV display) on your home network
