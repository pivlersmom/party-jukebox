# Party - Lichteffekt bei Nachschub
# Einfügen: Einstellungen → Automationen & Szenen → Skripte → Skript erstellen → ⋮ → „In YAML bearbeiten“
# → diesen Inhalt einfügen → Lampen eintragen → Speichern.
alias: Party - Lichteffekt bei Nachschub
description: >-
  Lampen, die gerade an sind, blitzen 2× gelb/orange (je 0,7 s – langsam genug auch für träge Lampen wie Govee) und gehen danach in ihren vorherigen Zustand zurück.
icon: mdi:glass-mug-variant
mode: single
variables:
  # >>> HIER DEINE LAMPEN EINTRAGEN (Entity-IDs in der Liste, beliebig viele) <<<
  # Nur Lampen, die gerade an sind (und nicht im Hue-Sync-Streaming), blinken mit.
  lampen: >-
    {{ ['light.LAMPE_1', 'light.LAMPE_2', 'light.LAMPE_3']
       | select('is_state', 'on') | reject('is_state_attr', 'mode', 'streaming') | list }}
sequence:
  - condition: template
    value_template: "{{ lampen | count > 0 }}"
  - action: scene.create
    data:
      scene_id: party_licht_vorher_bi
      snapshot_entities: "{{ lampen }}"
  - repeat:
      count: 2
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ lampen }}"
          data:
            rgb_color: [255, 190, 0]
            brightness: 255
            transition: 0
        - delay:
            milliseconds: 700
        - action: light.turn_on
          target:
            entity_id: "{{ lampen }}"
          data:
            rgb_color: [255, 90, 0]
            brightness: 255
            transition: 0
        - delay:
            milliseconds: 700
  - action: scene.turn_on
    target:
      entity_id: scene.party_licht_vorher_bi
    data:
      transition: 0.5
