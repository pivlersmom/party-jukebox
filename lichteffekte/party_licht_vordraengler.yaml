# Party - Lichteffekt bei Vordrängler
# Einfügen: Einstellungen → Automationen & Szenen → Skripte → Skript erstellen → ⋮ → „In YAML bearbeiten“
# → diesen Inhalt einfügen → Lampen eintragen → Speichern.
alias: Party - Lichteffekt bei Vordrängler
description: >-
  Lampen, die gerade an sind, blinken 3× rot/orange (Warnlicht für Vordrängler) und gehen danach in ihren vorherigen Zustand zurück.
icon: mdi:alarm-light
mode: single
variables:
  # >>> HIER DEINE LAMPEN EINTRAGEN (Entity-IDs in der Liste, beliebig viele) <<<
  # Nur Lampen, die gerade an sind (und nicht im Hue-Sync-Streaming), blinken mit.
  lampen: >-
    {{ ['light.LAMPE_1', 'light.LAMPE_2', 'light.LAMPE_3']
       | select('is_state', 'on') | reject('is_state_attr', 'mode', 'streaming') | list }}
sequence:
  - condition: template
    value_template: "{{ lampen | count > 0 }}"
  - action: scene.create
    data:
      scene_id: party_licht_vorher_bo
      snapshot_entities: "{{ lampen }}"
  - repeat:
      count: 3
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ lampen }}"
          data:
            rgb_color: [255, 0, 0]
            brightness: 255
            transition: 0
        - delay:
            milliseconds: 400
        - action: light.turn_on
          target:
            entity_id: "{{ lampen }}"
          data:
            rgb_color: [255, 90, 0]
            brightness: 90
            transition: 0
        - delay:
            milliseconds: 400
  - action: scene.turn_on
    target:
      entity_id: scene.party_licht_vorher_bo
    data:
      transition: 1
